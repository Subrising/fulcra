# Pull-request checks are routed by the behavior they prove. Package consumers
# do not inherit their dependencies' test suites. Browser checks cover UI and
# server paths plus the shared/root fallback. Nightly and release runs cover all.
routing:
  - ".github/ci-paths.yml"

workspace:
  - ".mise.toml"
  - ".tool-versions"
  - "package.json"
  - "package-lock.json"
  - "patches/**"
  - "scripts/**"
  - "tsconfig.json"
  - "tsconfig.base.json"
  - "vitest.config.ts"

ci:
  - ".github/actions/**"
  - ".github/workflows/ci.yml"
  - ".github/scripts/**"
  - ".github/browser-test-times.json"

format:
  - ".agents/**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"
  - ".github/**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"
  - "**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"
  - "packages/expo-two-way-audio/**"

quality:
  - "**/*.{cjs,js,json,jsx,mjs,ts,tsx}"
  - "packages/expo-two-way-audio/**"

hub:
  - "packages/cli/src/commands/hub/**"
  - "packages/server/src/server/hub/**"

server:
  - "plugins/**"
  - "control/**"
  - "packages/server/**"
  - "packages/app/e2e/support/fixtures/recording.*"

desktop:
  - "packages/desktop/**"
  - "packages/app/src/desktop/**"
  - "packages/app/src/device/plugin-device.electron.ts"
  - "packages/app/src/plugins/bundle-trust-policy.electron.ts"
  - "packages/server/src/server/browser-tools/**"
  - "packages/app/e2e/support/**"
  - "packages/app/*config.{cjs,js,ts}"
  - "packages/app/package.json"

app:
  - "packages/app/**"
  - "packages/expo-two-way-audio/**"

sdk:
  - "packages/plugin/**"
  - "plugin-examples/**"
  - "public-docs/plugins/**"
  - "packages/client/**"
  - "packages/highlight/**"
  - "packages/protocol/**"

browser:
  - "packages/app/**"
  - "packages/server/**"
  - "packages/expo-two-way-audio/**"
  - "control/orca-organization/client/**"
  - "control/orca-organization/shared/**"

relay:
  - "packages/relay/**"

cli:
  - "packages/cli/**"
