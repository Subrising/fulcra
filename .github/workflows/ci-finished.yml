name: CI finished

on:
  workflow_run:
    workflows: [CI, Merge PR]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: read

jobs:
  report:
    if: github.repository == 'Subrising/fulcra'
    runs-on: ubuntu-latest
    steps:
      # Always use the trusted default branch. Never load candidate code,
      # candidate artifacts, or candidate caches with this write token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record the tested merge tree and send one completion event
        env:
          GH_TOKEN: ${{ github.token }}
          FULCRA_CI_NOTICE_URL: ${{ vars.FULCRA_CI_NOTICE_URL }}
          FULCRA_CI_NOTICE_TOKEN: ${{ secrets.FULCRA_CI_NOTICE_TOKEN }}
        run: node .github/scripts/ci-finished.mjs
