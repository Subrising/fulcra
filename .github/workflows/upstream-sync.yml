name: Upstream sync

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git
        run: |
          git config user.name "fulcra-upstream-sync"
          git config user.email "fulcra-upstream-sync@users.noreply.github.com"
      - name: Merge upstream and verify
        id: sync
        run: |
          set +e
          scripts/sync-upstream.sh > sync.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"
          tail -n 60 sync.log
      - name: Push sync branch
        run: git push --force-with-lease origin "${{ steps.sync.outputs.branch }}"
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "${{ steps.sync.outputs.branch }}" \
            --title "Upstream sync ${{ steps.sync.outputs.branch }}" \
            --body "Automated merge of getpaseo/paseo main (script exit ${{ steps.sync.outputs.exit }}). See sync log in the workflow run and docs/UPSTREAM.md." \
            || echo "A pull request for this branch already exists."
