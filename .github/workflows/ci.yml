name: CI

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 16 * * *"
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ github.event_name != 'pull_request' || steps.filter.outputs.routing != 'false' || steps.filter.outputs.workspace != 'false' || steps.filter.outputs.ci != 'false' || steps.shared.outputs.full != 'false' }}
      format: ${{ steps.filter.outputs.format }}
      quality: ${{ steps.filter.outputs.quality }}
      hub: ${{ steps.filter.outputs.hub }}
      server: ${{ steps.filter.outputs.server }}
      desktop: ${{ steps.filter.outputs.desktop }}
      app: ${{ steps.filter.outputs.app }}
      sdk: ${{ steps.filter.outputs.sdk }}
      browser: ${{ github.event_name != 'pull_request' || steps.filter.outputs.browser != 'false' }}
      relay: ${{ steps.filter.outputs.relay }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect affected CI contracts
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Detect shared and root changes
        id: shared
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-shared-changes.mjs

      - name: Validate CI contracts
        run: node --test scripts/ci-workflow.test.mjs .github/scripts/browser-routing.test.mjs .github/scripts/ci-built-cli.test.mjs scripts/windows-update/update-script.test.mjs scripts/install-git-hooks.test.mjs scripts/daemon-launch-contract.test.mjs scripts/test-support/test-home.test.mjs scripts/sync-fdroid-changelogs.test.mjs scripts/upload-release-assets.test.mjs scripts/upstream-watch.test.mjs scripts/fork-ledger.test.mjs

  format:
    name: format
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.format != 'false') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-deps

      - name: Check formatting
        run: npm run format:check

  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-deps

      - name: Lint lockfile
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint

  # FULCRA: no machine data or owner details in public files or commit metadata. The real values come
  # from a secret. On pull requests, GitHub's own test merge commit is skipped: it carries the account identity.
  machine-data:
    name: machine-data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the check
        run: node --test scripts/check-machine-data.test.mjs

      - name: Check for machine data and personal details
        env:
          FULCRA_PRIVATE_PATTERNS: ${{ secrets.FULCRA_PRIVATE_PATTERNS }}
        run: node scripts/check-machine-data.mjs --commits "${{ github.event.pull_request.head.sha || github.sha }}"

  typecheck:
    name: typecheck
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-deps

      - name: Restore server build outputs
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            plugins/dist
          key: build-v2-${{ runner.os }}-node22-server-${{ hashFiles('package-lock.json', 'package.json', 'tsconfig*.json', 'packages/**', '!packages/app/src/**', '!packages/*/playwright.config.ts', '!packages/*/e2e/**', '!packages/*/tests/**', 'plugins/**', 'control/**', 'skills/**', 'scripts/**', '!scripts/ci-workflow.test.mjs', 'patches/**') }}

      - name: Build server stack
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build:server

      - name: Verify built-in plugins from built output
        run: node --test scripts/builtin-plugin-runtime.test.mjs scripts/builtin-plugins-dist.test.mjs

      # FU-90: package the Command Centre plugin as the app build does. A plugin import that the staged bundle
      # cannot resolve (0.2.16.2: ask.mjs -> ../../src/control) passed every test and only failed at packaging.
      - name: Package the Command Centre plugin
        env:
          FULCRA_PLUGIN_OUTPUT: ${{ runner.temp }}/command-centre-plugin
        run: node scripts/build-command-centre.mjs "$PWD/control"

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Run website tests
        run: npx vitest run packages/website/src --bail=1

      - name: Install website test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify website mockups
        run: npm run test:e2e --workspace=@getpaseo/website

      - name: Verify public package contents
        run: |
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/protocol
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/client
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/server

  server-tests-ubuntu:
    name: server-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') }}
    runs-on: ubuntu-24.04
    env:
      SERVER_UNIT_SHARD: "1/2"
    steps: &server_test_steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/ci-deps

      - name: Fetch origin/main (worktree tests)
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Install agent CLIs for provider tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai

      - name: Restore server-deps build outputs
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            plugins/dist
          key: build-v2-${{ runner.os }}-node22-server-deps-${{ hashFiles('package-lock.json', 'package.json', 'tsconfig*.json', 'packages/**', '!packages/app/src/**', '!packages/*/playwright.config.ts', '!packages/*/e2e/**', '!packages/*/tests/**', 'plugins/**', 'control/**', 'skills/**', 'scripts/**', '!scripts/ci-workflow.test.mjs', 'patches/**') }}

      - name: Build server dependencies
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build:server-deps

      - name: Run server tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test:unit --workspace=@getpaseo/server -- --shard=${{ env.SERVER_UNIT_SHARD }} --maxWorkers=2
        env:
          PASEO_SKIP_PROTOCOL_BUILD: "1"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run server integration tests
        if: ${{ env.SERVER_UNIT_SHARD == '1/2' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') }}
        run: npm run test:integration --workspace=@getpaseo/server
        env:
          PASEO_SKIP_PROTOCOL_BUILD: "1"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run built-in plugin tests
        if: ${{ env.SERVER_UNIT_SHARD == '1/2' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') }}
        run: npm run test --workspace=@getpaseo/builtin-plugins
      - name: Run controller lifecycle contracts
        if: ${{ env.SERVER_UNIT_SHARD == '1/2' && runner.os == 'Linux' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') }}
        env:
          ORCA_HOME: ${{ runner.temp }}/fulcra-controller-contracts
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import { firstRun } from "./control/src/config.mjs"; fs.mkdirSync(process.env.ORCA_HOME, { recursive: true, mode: 0o700 }); firstRun({ ORCA_HOME: fs.realpathSync(process.env.ORCA_HOME) });'
          export ORCA_HOME="$(realpath "$ORCA_HOME")"
          node control/orca-organization/verify.mjs
          node --test control/src/control/tool-surface.test.mjs control/src/control/provider-recovery.test.mjs control/src/control/role-channels.test.mjs control/src/control/recovery.test.mjs control/src/control/compaction-loops.test.mjs control/src/control/worktree-lifecycle-runtime.test.mjs control/src/control/worktree-lifecycle.test.mjs control/src/control/command-parser.test.mjs control/src/control/rpc-methods.test.mjs control/src/control/team.test.mjs control/src/control/owned-child-files.test.mjs control/src/config.test.mjs
          npx tsx --test control/orca-organization/server/team-setup.test.ts

      - name: Run Hub CLI/daemon contract
        if: ${{ needs.changes.outputs.full == 'false' && needs.changes.outputs.server == 'false' && needs.changes.outputs.hub != 'false' }}
        run: npm run test:hub-cli-contract --workspace=@getpaseo/server

  # Fulcra runs on macOS. native-recursive.ts serves darwin; this job exercises it on a
  # macOS runner. Scoped to the observer/watcher suites to bound runtime.
  server-tests-ubuntu-2:
    name: server-tests (ubuntu-latest, unit 2/2)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') }}
    runs-on: ubuntu-24.04
    env:
      SERVER_UNIT_SHARD: "2/2"
    steps: *server_test_steps

  server-tests-macos:
    name: server-tests (macos-14, file observation)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Restore server-deps build outputs
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            plugins/dist
          key: build-v2-${{ runner.os }}-node22-server-deps-${{ hashFiles('package-lock.json', 'package.json', 'tsconfig*.json', 'packages/**', '!packages/app/src/**', '!packages/*/playwright.config.ts', '!packages/*/e2e/**', '!packages/*/tests/**', 'plugins/**', 'control/**', 'skills/**', 'scripts/**', '!scripts/ci-workflow.test.mjs', 'patches/**') }}

      - name: Build server dependencies
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build:server-deps

      - name: Run file observation tests
        run: |
          npm run test:unit --workspace=@getpaseo/server -- \
            src/server/file-observer \
            src/server/workspace-git-service.observation.test.ts \
            src/server/workspace-git-service.observation.integration.test.ts \
            --bail=1
        env:
          PASEO_SKIP_PROTOCOL_BUILD: "1"

  desktop-tests-ubuntu:
    name: desktop-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DESKTOP_SUITE: lifecycle
    steps: &desktop_test_steps
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-deps

      - name: Restore server build outputs
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            plugins/dist
          key: build-v2-${{ runner.os }}-node22-server-${{ hashFiles('package-lock.json', 'package.json', 'tsconfig*.json', 'packages/**', '!packages/app/src/**', '!packages/*/playwright.config.ts', '!packages/*/e2e/**', '!packages/*/tests/**', 'plugins/**', 'control/**', 'skills/**', 'scripts/**', '!scripts/ci-workflow.test.mjs', 'patches/**') }}

      - name: Build server stack
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build:server

      - name: Run desktop tests
        if: ${{ env.DESKTOP_SUITE != 'renderer' }}
        run: npm run test --workspace=@getpaseo/desktop

      - name: Install virtual display
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool

      - name: Install Playwright browser
        if: ${{ runner.os == 'Linux' }}
        run: npx playwright install chromium

      - name: Verify Windows daemon process control
        if: ${{ runner.os == 'Windows' }}
        run: npx vitest run packages/cli/src/commands/daemon/lifecycle.e2e.test.ts --bail=1 --maxWorkers=1 -t "Windows unbound|managed two-home"

      - name: Run desktop lifecycle E2E (Linux)
        if: ${{ runner.os == 'Linux' && env.DESKTOP_SUITE != 'renderer' }}
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npm run test:e2e:lifecycle --workspace=@getpaseo/desktop
        env:
          PASEO_DESKTOP_LIFECYCLE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-lifecycle

      # Diagnostics only. Actions storage quota must not fail a build whose
      # tests and packaging passed; the failure is reported instead. Every
      # other step in this job stays failure-sensitive.
      - name: Upload desktop lifecycle screenshots
        id: upload-desktop-lifecycle
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          name: desktop-lifecycle
          path: ${{ runner.temp }}/desktop-lifecycle
          if-no-files-found: ignore
          retention-days: 7

      - name: Report unavailable desktop-lifecycle diagnostics
        if: ${{ !cancelled() && steps.upload-desktop-lifecycle.outcome == 'failure' }}
        run: |
          echo "::warning title=Diagnostic upload failed::desktop-lifecycle was not uploaded. The job log still has the full output."
          echo "Diagnostic artifact \`desktop-lifecycle\` could not be uploaded, commonly Actions storage quota. This did not affect any test, build or packaging result; the job log is unchanged." >> "$GITHUB_STEP_SUMMARY"

      - name: Run desktop lifecycle E2E (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: npm run test:e2e:lifecycle --workspace=@getpaseo/desktop

      - name: Run desktop renderer E2E
        if: ${{ env.DESKTOP_SUITE == 'renderer' }}
        run: npm run test:e2e:renderer --workspace=@getpaseo/desktop -- --shard=${{ env.DESKTOP_RENDERER_SHARD }} --workers=2 --fully-parallel

      - name: Run desktop browser E2E
        if: ${{ runner.os == 'Linux' && env.DESKTOP_SUITE != 'renderer' }}
        run: npm run test:e2e:browser-tabs --workspace=@getpaseo/desktop
        env:
          PASEO_DESKTOP_BROWSER_E2E_ARTIFACT_DIR: ${{ runner.temp }}/desktop-browser-e2e

      # Diagnostics only. Actions storage quota must not fail a build whose
      # tests and packaging passed; the failure is reported instead. Every
      # other step in this job stays failure-sensitive.
      - name: Upload desktop browser diagnostics
        id: upload-desktop-browser
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ failure() && runner.os == 'Linux' }}
        with:
          name: desktop-browser-e2e
          path: ${{ runner.temp }}/desktop-browser-e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Report unavailable desktop-browser-e2e diagnostics
        if: ${{ !cancelled() && steps.upload-desktop-browser.outcome == 'failure' }}
        run: |
          echo "::warning title=Diagnostic upload failed::desktop-browser-e2e was not uploaded. The job log still has the full output."
          echo "Diagnostic artifact \`desktop-browser-e2e\` could not be uploaded, commonly Actions storage quota. This did not affect any test, build or packaging result; the job log is unchanged." >> "$GITHUB_STEP_SUMMARY"

  desktop-renderer:
    name: desktop-renderer
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DESKTOP_SUITE: renderer
      E2E_USE_BUILT_DAEMON: "1"
      DESKTOP_RENDERER_SHARD: "1/2"
    steps: *desktop_test_steps

  desktop-renderer-2:
    name: desktop-renderer (2/2)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DESKTOP_SUITE: renderer
      E2E_USE_BUILT_DAEMON: "1"
      DESKTOP_RENDERER_SHARD: "2/2"
    steps: *desktop_test_steps

  app-tests:
    name: app-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.app != 'false') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-deps

      - name: Verify dependency overrides
        run: npm run test:dependency-overrides

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Restore app-deps build outputs
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            plugins/dist
          key: build-v2-${{ runner.os }}-node22-app-deps-${{ hashFiles('package-lock.json', 'package.json', 'tsconfig*.json', 'packages/**', '!packages/app/src/**', '!packages/*/playwright.config.ts', '!packages/*/e2e/**', '!packages/*/tests/**', 'plugins/**', 'control/**', 'skills/**', 'scripts/**', '!scripts/ci-workflow.test.mjs', 'patches/**') }}

      - name: Build app dependencies
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build:app-deps

      - name: Run app unit tests
        run: npm run test --workspace=@getpaseo/app
        env:
          PASEO_SKIP_PROTOCOL_BUILD: "1"

  sdk-tests:
    name: sdk-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-deps

      - name: Restore exact SDK dependencies
        id: sdk-build
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            plugins/dist
          key: build-v2-${{ runner.os }}-node22-server-deps-${{ hashFiles('package-lock.json', 'package.json', 'tsconfig*.json', 'packages/**', '!packages/app/src/**', '!packages/*/playwright.config.ts', '!packages/*/e2e/**', '!packages/*/tests/**', 'plugins/**', 'control/**', 'skills/**', 'scripts/**', '!scripts/ci-workflow.test.mjs', 'patches/**') }}

      - name: Build SDK dependencies
        if: steps.sdk-build.outputs.cache-hit != 'true'
        run: npm run build:server-deps

      - name: Run plugin SDK tests
        run: npm run test --workspace=@getpaseo/plugin
        env:
          PASEO_SKIP_PROTOCOL_BUILD: "1"

      - name: Run protocol tests
        run: npm run test --workspace=@getpaseo/protocol
        env:
          PASEO_SKIP_PROTOCOL_BUILD: "1"

      - name: Run client tests
        run: npm run test --workspace=@getpaseo/client
        env:
          PASEO_SKIP_PROTOCOL_BUILD: "1"

      - name: Run highlight tests
        run: npm run test --workspace=@getpaseo/highlight
        env:
          PASEO_SKIP_PROTOCOL_BUILD: "1"

      - name: Typecheck client examples
        run: npm run typecheck:examples --workspace=@getpaseo/client

  browser-prepare:
    name: browser-prepare
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.browser != 'false' }}
    runs-on: ubuntu-24.04
    outputs:
      cache-key: ${{ steps.inputs.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-deps
      - name: Identify immutable browser inputs
        id: inputs
        run: echo "key=browser-inputs-v1-${{ runner.os }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Restore exact browser build
        id: shared-cache
        uses: actions/cache@v4
        with:
          path: browser-inputs.tgz
          key: ${{ steps.inputs.outputs.key }}
      - name: Restore exact server build
        id: daemon-build
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            plugins/dist
          key: build-v2-${{ runner.os }}-node22-server-${{ hashFiles('package-lock.json', 'package.json', 'tsconfig*.json', 'packages/**', '!packages/app/src/**', '!packages/*/playwright.config.ts', '!packages/*/e2e/**', '!packages/*/tests/**', 'plugins/**', 'control/**', 'skills/**', 'scripts/**', '!scripts/ci-workflow.test.mjs', 'patches/**') }}
      - name: Restore exact web export
        id: web-build
        uses: actions/cache@v4
        with:
          path: packages/app/.e2e-web
          key: browser-web-v2-${{ runner.os }}-${{ hashFiles('.github/scripts/export-browser-web.sh', 'package-lock.json', 'package.json', 'tsconfig*.json', 'packages/**', '!packages/*/playwright.config.ts', '!packages/app/src/**/*.test.*', '!packages/app/src/**/*.spec.*', '!packages/*/e2e/**', '!packages/*/tests/**', 'plugins/**', 'control/**', 'skills/**', 'scripts/**', '!scripts/ci-workflow.test.mjs', 'patches/**') }}
      - name: Restore Metro transform cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fulcra-metro
          key: metro-web-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'packages/app/babel.config.js', 'packages/app/metro.config.cjs') }}-${{ github.sha }}
          restore-keys: metro-web-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'packages/app/babel.config.js', 'packages/app/metro.config.cjs') }}-
      - name: Build web and daemon once; plan timed cases
        if: steps.shared-cache.outputs.cache-hit != 'true'
        env:
          E2E_METRO_CACHE: ${{ runner.temp }}/fulcra-metro
          E2E_PLAN_ONLY: "1"
          NODE_OPTIONS: --max-old-space-size=4096
          DAEMON_BUILD_HIT: ${{ steps.daemon-build.outputs.cache-hit }}
          WEB_BUILD_HIT: ${{ steps.web-build.outputs.cache-hit }}
        run: |
          if [ "$DAEMON_BUILD_HIT" != 'true' ]; then npm run build:server-deps; fi
          npm run build --workspace=@getpaseo/expo-two-way-audio
          # Both branches read built dependencies. Preserve each exit status.
          (if [ "$DAEMON_BUILD_HIT" != 'true' ]; then npm run build --workspace=@getpaseo/server && npm run build --workspace=@getpaseo/cli; fi) &
          daemon_pid=$!
          (if [ "$WEB_BUILD_HIT" != 'true' ]; then bash .github/scripts/export-browser-web.sh; fi) &
          web_pid=$!
          daemon_status=0; wait "$daemon_pid" || daemon_status=$?
          web_status=0; wait "$web_pid" || web_status=$?
          if [ "$daemon_status" -ne 0 ] || [ "$web_status" -ne 0 ]; then exit 1; fi
          npm run test:e2e --workspace=@getpaseo/app -- --list --reporter=../../.github/scripts/browser-ci-reporter.mjs
          E2E_PLAN_ONLY=0 E2E_SELECTED_LIST=.e2e-plan/all.txt npm run test:e2e --workspace=@getpaseo/app -- --list --test-list=.e2e-plan/all.txt --reporter=../../.github/scripts/browser-ci-reporter.mjs
          node .github/scripts/browser-inputs.mjs
          tar -czf browser-inputs.tgz -T browser-input-paths.txt

  playwright-1:
    name: playwright (shard 1/32)
    needs: [changes, browser-prepare]
    if: ${{ !cancelled() && needs.browser-prepare.result == 'success' && needs.changes.outputs.browser != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PLAYWRIGHT_ARTIFACT: "1"
      E2E_STATIC_WEB: "1"
      E2E_REPORT_CI: "1"
      E2E_USE_BUILT_DAEMON: "1"
    steps: &playwright_test_steps
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-deps

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Restore shared browser inputs
        uses: actions/cache/restore@v4
        with:
          path: browser-inputs.tgz
          key: ${{ needs.browser-prepare.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Unpack tested browser inputs
        run: tar -xzf browser-inputs.tgz

      - name: Restore failed test list on a job retry
        if: ${{ github.run_attempt != '1' }}
        uses: actions/cache/restore@v4
        with:
          path: packages/app/.e2e-retry
          key: browser-failed-${{ github.run_id }}-${{ github.sha }}-${{ env.PLAYWRIGHT_ARTIFACT }}-${{ github.run_attempt }}
          restore-keys: browser-failed-${{ github.run_id }}-${{ github.sha }}-${{ env.PLAYWRIGHT_ARTIFACT }}-

      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run timed browser test selection
        id: browser-tests
        run: node .github/scripts/run-browser-ci.mjs "$PLAYWRIGHT_ARTIFACT"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Save failed test list for this exact run and head
        if: ${{ failure() && steps.browser-tests.outcome == 'failure' }}
        uses: actions/cache/save@v4
        with:
          path: packages/app/.e2e-retry
          key: browser-failed-${{ github.run_id }}-${{ github.sha }}-${{ env.PLAYWRIGHT_ARTIFACT }}-${{ github.run_attempt }}

      # Diagnostics only. Actions storage quota must not fail a build whose
      # tests and packaging passed; the failure is reported instead. Every
      # other step in this job stays failure-sensitive.
      - name: Upload test artifacts
        id: upload-playwright
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: failure()
        with:
          name: playwright-results-${{ env.PLAYWRIGHT_ARTIFACT }}
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          retention-days: 7

      - name: Report unavailable playwright-results diagnostics
        if: ${{ !cancelled() && steps.upload-playwright.outcome == 'failure' }}
        run: |
          echo "::warning title=Diagnostic upload failed::playwright-results was not uploaded. The job log still has the full output."
          echo "Diagnostic artifact \`playwright-results\` could not be uploaded, commonly Actions storage quota. This did not affect any test, build or packaging result; the job log is unchanged." >> "$GITHUB_STEP_SUMMARY"

