      - name: Run CLI E2E tests
        if: ${{ env.CLI_SUITE != 'source' }}
        run: npm run test:local --workspace=@getpaseo/cli
        env:
          PASEO_CLI_TEST_USE_BUILT: "1"

      - name: Run CLI source tests
        if: ${{ env.CLI_SUITE == 'source' }}
        run: npm run test:unit --workspace=@getpaseo/cli -- --maxConcurrency=2
        env:
          PASEO_SKIP_PROTOCOL_BUILD: "1"

  cli-tests-2:
    name: cli-tests (shard 2/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-24.04
    env:
      PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      PASEO_DICTATION_ENABLED: "0"
      PASEO_VOICE_MODE_ENABLED: "0"
      PASEO_CLI_TEST_SHARD: "2"
      PASEO_CLI_TEST_SHARD_TOTAL: "3"
    steps: *cli_test_steps

  cli-tests-3:
    name: cli-tests (shard 3/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-24.04
    env:
      PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      PASEO_DICTATION_ENABLED: "0"
      PASEO_VOICE_MODE_ENABLED: "0"
      PASEO_CLI_TEST_SHARD: "3"
      PASEO_CLI_TEST_SHARD_TOTAL: "3"
    steps: *cli_test_steps

  cli-source-tests:
    name: cli-source-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-24.04
    env:
      CLI_SUITE: source
      PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      PASEO_DICTATION_ENABLED: "0"
      PASEO_VOICE_MODE_ENABLED: "0"
    steps: *cli_test_steps

  # FULCRA: the one check that branch protection on main requires. A job skipped by the path filter counts as passed;
  # a failed or cancelled job fails this one. Add every new job to `needs`. `!cancelled()` (not always()) so a
  # superseded run still cancels; a cancelled run leaves this check cancelled, which does not pass protection.
  ci-passed:
    name: ci-passed
    if: ${{ !cancelled() }}
    needs:
      - changes
      - format
      - lint
      - machine-data
      - typecheck
      - server-tests-ubuntu
      - server-tests-ubuntu-2
      - server-tests-macos
      - desktop-tests-ubuntu
      - desktop-renderer
      - desktop-renderer-2
      - app-tests
      - sdk-tests
      - playwright-1
      - playwright-2
      - playwright-3
      - playwright-4
      - playwright-5
      - playwright-6
      - playwright-7
      - playwright-8
      - playwright-9
      - playwright-10
      - playwright-11
      - playwright-12
      - playwright-13
      - playwright-14
      - playwright-15
      - playwright-16
      - playwright-17
      - playwright-18
      - playwright-19
      - playwright-20
      - playwright-21
      - playwright-22
      - playwright-23
      - playwright-24
      - playwright-25
      - playwright-26
      - playwright-27
      - playwright-28
      - playwright-29
      - playwright-30
      - playwright-31
      - playwright-32
      - browser-prepare
      - browser-recovery
      - relay-tests
      - relay-grant-e2e
      - cli-tests-1
      - cli-tests-2
      - cli-tests-3
      - cli-source-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "$RESULTS"
          # The path filter must have run. If it did not succeed, a skipped job may not mean "no changes".
          if [ "$CHANGES" != "success" ]; then
            echo "The changes job did not succeed ($CHANGES)."
            exit 1
          fi
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "A CI job failed or was cancelled."
            exit 1
          fi
