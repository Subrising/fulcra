name: Nix Update Hash

on:
  push:
    branches: [main]
    paths:
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "package.json"
      - "package-lock.json"
      - "packages/highlight/**"
      - "packages/plugin/**"
      - "packages/server/**"
      - "packages/relay/**"
      - "packages/cli/**"
      - "scripts/update-nix.sh"
      - "scripts/fix-lockfile.mjs"
      - ".github/workflows/nix-update-hash.yml"

permissions:
  contents: read

jobs:
  update-hash:
    runs-on: ubuntu-latest
    steps:
      # This job commits back to the branch as upstream's bot. A fork without
      # those App credentials cannot, and previously failed on the first step
      # with an opaque token error. Report the state and stop instead.
      - name: Check bot credentials
        id: config
        env:
          APP_ID: ${{ secrets.PASEO_BOT_APP_ID }}
          APP_KEY: ${{ secrets.PASEO_BOT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Skipped: automatic Nix hash refresh is not configured"
              echo
              echo "This job needs \`PASEO_BOT_APP_ID\` and \`PASEO_BOT_APP_PRIVATE_KEY\` to commit"
              echo "\`package-lock.json\` and \`nix/npm-deps.hash\` back to the branch."
              echo
              echo "Refresh them by hand instead:"
              echo
              echo '```sh'
              echo './scripts/update-nix.sh   # rewrites nix/npm-deps.hash when stale'
              echo '```'
              echo
              echo "then commit both files. The Nix workflow keeps validating builds either way:"
              echo "each of its jobs runs \`update-nix.sh\` before building, so a stale committed"
              echo "hash does not fail the build, it only leaves the repository non-reproducible"
              echo "for external Nix consumers until the refresh lands."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/create-github-app-token@v1
        id: app-token
        if: steps.config.outputs.ready == 'true'
        with:
          app-id: ${{ secrets.PASEO_BOT_APP_ID }}
          private-key: ${{ secrets.PASEO_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: "npm"

      - uses: cachix/install-nix-action@v31
        if: steps.config.outputs.ready == 'true'
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update lockfile + Nix hash if stale
        if: steps.config.outputs.ready == 'true'
        run: ./scripts/update-nix.sh

      - name: Build Nix package
        if: steps.config.outputs.ready == 'true'
        run: nix build .#default -o result

      - name: Commit hash/lockfile updates
        if: steps.config.outputs.ready == 'true'
        run: |
          git diff --quiet package-lock.json nix/npm-deps.hash && exit 0
          git config user.name "paseo-ai[bot]"
          git config user.email "266920839+paseo-ai[bot]@users.noreply.github.com"
          git add package-lock.json nix/npm-deps.hash
          git commit -m "fix: update lockfile signatures and Nix hash [skip ci]"
          git push
