<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fulcra social preview</title>
    <link rel="stylesheet" href="site.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .preview {
        height: 100%;
        padding: 60px 74px;
        background:
          radial-gradient(60% 46% at 50% 2%, rgba(255, 138, 91, 0.3), transparent 70%),
          radial-gradient(90% 70% at 50% 0%, rgba(94, 22, 35, 0.85), transparent 72%), #121112;
      }
      .preview .brand {
        font-size: 34px;
      }
      .preview h1 {
        font-size: 77px;
        margin: 52px 0 28px;
        line-height: 1.08;
        letter-spacing: -0.035em;
        font-weight: 650;
      }
      .preview h1 span {
        color: #ff8a5b;
      }
      .preview p {
        font-size: 24px;
        color: #b9b0a6;
        max-width: 1000px;
      }
    </style>
  </head>
  <body>
    <div class="preview">
      <div class="brand">
        <img src="assets/fulcra-mark.svg" alt="" width="42" height="42" />Fulcra
      </div>
      <h1>You set direction.<br />Primes coordinate<br /><span>the work.</span></h1>
      <p>You → primes → project orchestrators → working sessions</p>
    </div>
  </body>
</html>
