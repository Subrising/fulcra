npmRebuild: false
appId: dev.orca.workspace.desktop
productName: Fulcra
executableName: Fulcra
protocols:
  - name: Orca conversation link
    schemes:
      - orca
  - name: Fulcra sign-in link
    schemes:
      - fulcra
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  # Skills are filesystem data, so include them explicitly in the server catalog.
  - from: ../../skills
    to: node_modules/@getpaseo/server/dist/server/skills
    filter:
      - "**/*"
  - "!**/*.map"
  - "!**/*.tsbuildinfo"
  - "!node_modules/@getpaseo/*/src/**"
  - "!node_modules/@getpaseo/**/*.test.*"
  - "!node_modules/@getpaseo/**/*.spec.*"
  - "!node_modules/@getpaseo/server/dist/server/web-ui/**"
  # Development-only conversation processor carries recorded debug fixture names.
  - "!node_modules/@getpaseo/server/scripts/process-conversation.ts"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@getpaseo/*/.debug/**"
  - "!node_modules/@getpaseo/*/.tasks/**"
  - "!node_modules/@getpaseo/*/conversations/**"
  - "!node_modules/@getpaseo/*/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@getpaseo/server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: bundled-plugins
    to: bundled-plugins
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
# Orca has no public update feed yet. Never publish into the upstream project.
publish: null
mac:
  artifactName: "Fulcra-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/fulcra-v1/icon.png
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/paseo
      to: bin/paseo
    - from: assets/fulcra-v1/icon.png
      to: icon.png
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets/fulcra-v1/icon.png
  artifactName: "Fulcra-${version}-${arch}.${ext}"
  maintainer: "Mohamed Boudra <hello@moboudra.com>"
  vendor: "Fulcra"
  extraResources:
    - from: bin/paseo
      to: bin/paseo
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  afterInstall: scripts/linux-sandbox/after-install.tpl
rpm:
  afterInstall: scripts/linux-sandbox/after-install.tpl
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ["--class=Fulcra"]
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/paseo CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "Fulcra-${arch}.${ext}"
win:
  artifactName: "Fulcra-Setup-${version}-${arch}.${ext}"
  icon: assets/fulcra-v1/icon.png
  extraResources:
    - from: bin/paseo.cmd
      to: bin/paseo.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
